<!doctype html>
<html lang="en">
  <head>
    <!-- Prevent theme flash: apply stored theme before any CSS loads -->
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("knapsnack_settings") || "{}",
          );
          var theme = s.theme || "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (s.oledMode)
            document.documentElement.setAttribute("data-oled", "true");
          if (window.SafeAreaBridge)
            SafeAreaBridge.setStatusBarStyle(theme === "light");
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Weight Knapsnack Calculator - use dynamic programming to find the optimal combination of weighted bottles that best matches your target workout weight."
    />
    <meta
      property="og:title"
      content="Knapsnack Calculator - Weight Knapsnack"
    />
    <meta
      property="og:description"
      content="Calculate the optimal weighted bottle setup for your target weight with Knapsnack Calculator."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ankitsm08.github.io/weight-knapsnack/knapsnack.html"
    />
    <link
      rel="canonical"
      href="https://ankitsm08.github.io/weight-knapsnack/knapsnack.html"
    />
    <meta name="theme-color" content="#1e1e2e" />
    <link rel="icon" type="image/x-icon" href="static/favicon.png" />
    <link rel="stylesheet" href="css/overlay.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/a11y.css" />
    <script src="js/animations.js"></script>
    <title>Knapsnack Calculator - Weight Knapsnack</title>
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <nav aria-label="Main navigation">
      <a href="https://ankitsm08.github.io">
        <div class="logo"><i data-lucide="zap"></i> Ankit Sharma</div>
      </a>
      <button
        class="menu-toggle"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
      <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./knapsnack.html" class="active">Knapsnack</a>
        <a href="./profiles.html">Profiles</a>
        <a href="./settings.html">Settings</a>
        <a href="./about.html">About</a>
      </div>
    </nav>

    <main id="main-content">
      <section class="center fade-in">
        <h1>Knapsnack Calculator</h1>
        <p>
          Select a profile, enter your target weight, and find the best bottle
          combo!
        </p>

        <form id="knapsnack-form" novalidate>
          <!-- Profile selector -->
          <div class="card profile-selector">
            <label><i data-lucide="user-cog"></i> Profile:</label>
            <div class="select-wrapper">
              <select id="profile-select" aria-label="Select profile"></select>
              <i data-lucide="chevron-down" class="select-arrow"></i>
            </div>
            <a href="./profiles.html">Manage &rarr;</a>
          </div>

          <!-- Row 1: Target Weight + Bag Weight -->
          <div class="form-row">
            <div class="card">
              <label for="target_weight"
                ><i data-lucide="target"></i> Target Weight
                <span class="unit-label" id="target-unit-label">(kg)</span>
                <span
                  class="info-icon"
                  tabindex="0"
                  data-tooltip="How much total weight do you want your backpack to be?"
                  ><i data-lucide="info"></i
                ></span>
              </label>
              <input
                type="text"
                id="target_weight"
                name="target_weight"
                placeholder="e.g. 11.5 or 20lb"
                required
              />
            </div>
            <div class="card">
              <label for="bag_weight"
                ><i data-lucide="backpack"></i> Bag Weight
                <span class="unit-label" id="bag-unit-label">(g)</span>

                <span
                  class="info-icon"
                  tabindex="0"
                  data-tooltip="Weight of your empty backpack. <br> (optional - leave 0) <br> if you only want bottle weights)"
                  ><i data-lucide="info"></i
                ></span>
              </label>
              <input
                type="text"
                id="bag_weight"
                name="bag_weight"
                placeholder="e.g. 500g, 1kg"
              />
            </div>
          </div>

          <!-- Row 2: Overshoot + Ratio -->
          <div class="form-row form-row-2">
            <div class="card card-checkbox card-inline">
              <label for="allow_overshoot">
                <input
                  type="checkbox"
                  id="allow_overshoot"
                  name="allow_overshoot"
                  checked
                />
                <i data-lucide="trending-up"></i> Allow overshoot
                <span
                  class="info-icon"
                  tabindex="0"
                  data-tooltip="Allow the final weight be slightly more than your target. <br> (default - checked)"
                  ><i data-lucide="info"></i
                ></span>
              </label>
            </div>
            <div class="card card-inline">
              <label for="overshoot_ratio"
                ><i data-lucide="sliders"></i> Ratio
                <span
                  class="info-icon"
                  tabindex="0"
                  data-tooltip="How much extra weight is okay? <br> Lower = stricter, <br> Higher = more flexible. <br> (range - 0 to 1.0, default - 0.5)"
                  ><i data-lucide="info"></i
                ></span>
              </label>
              <input
                type="number"
                step="0.1"
                id="overshoot_ratio"
                name="overshoot_ratio"
                placeholder="0.5"
              />
            </div>
          </div>

          <!-- Row 3: Penalty + Max Bottles -->
          <div class="form-row form-row-2">
            <div class="card card-inline">
              <label for="bottle_penalty"
                ><i data-lucide="minus-circle"></i> Penalty
                <span
                  class="info-icon"
                  tabindex="0"
                  data-tooltip="Prefer fewer bottles? <br> Higher = prefer fewer bottles <br> (default - 50)"
                  ><i data-lucide="info"></i
                ></span>
              </label>
              <input
                type="number"
                step="10"
                id="bottle_penalty"
                name="bottle_penalty"
                placeholder="50"
              />
            </div>
            <div class="card card-inline">
              <label for="max_bottles"
                ><i data-lucide="layers"></i> Max Bottles
                <span
                  class="info-icon"
                  tabindex="0"
                  data-tooltip="Maximum number of bottles allowed. Set to 0 or leave empty to disable."
                  ><i data-lucide="info"></i
                ></span>
              </label>
              <input
                type="number"
                step="1"
                min="0"
                id="max_bottles"
                name="max_bottles"
                placeholder="0"
              />
            </div>
          </div>

          <div class="form-action-row">
            <button type="submit" class="btn big">
              <i data-lucide="calculator"></i> Calculate
            </button>
            <button
              type="button"
              id="clear-overrides-btn"
              class="btn btn-small"
            >
              <i data-lucide="rotate-ccw"></i> Reset
            </button>
          </div>
        </form>

        <div
          id="result"
          aria-live="polite"
          aria-atomic="true"
          role="region"
          aria-label="Calculation result"
        ></div>

        <div id="history-section" class="card collapsible closed">
          <div
            class="collapse-header"
            role="button"
            tabindex="0"
            aria-expanded="false"
          >
            <label><i data-lucide="clock"></i> Calculation History (0)</label>
            <span class="collapse-arrow"
              ><i data-lucide="chevron-down"></i
            ></span>
          </div>
          <div class="collapse-body">
            <p class="history-empty">No calculations yet</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> Ankit Sharma</p>
    </footer>

    <script src="js/storage.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/accessibility.js" defer></script>
    <script src="js/knapsnack.js" defer></script>
    <script src="js/calculator.js" defer></script>
    <script src="js/style.js" defer></script>
    <script
      src="js/vendor/lucide.min.js"
      defer
      onload="UI.renderIcons()"
    ></script>
    <div
      id="a11y-live"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
