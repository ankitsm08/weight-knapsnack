<!doctype html>
<html lang="en">
  <head>
    <!-- Prevent theme flash: apply stored theme before any CSS loads -->
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("knapsnack_settings") || "{}",
          );
          var theme = s.theme || "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (s.oledMode)
            document.documentElement.setAttribute("data-oled", "true");
          if (window.SafeAreaBridge)
            SafeAreaBridge.setStatusBarStyle(theme === "light");
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Weight Knapsnack - find the optimal combination of weighted bottles for your workout."
    />
    <meta property="og:title" content="Weight Knapsnack" />
    <meta
      property="og:description"
      content="Find the best weighted bottle combination for your workout with Weight Knapsnack."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ankitsm08.github.io/weight-knapsnack/"
    />
    <link
      rel="canonical"
      href="https://ankitsm08.github.io/weight-knapsnack/"
    />
    <!-- Android only: reads status bar height from Java bridge, sets as CSS var -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.SafeAreaBridge) {
          document.documentElement.style.setProperty(
            "--safe-area-inset-top",
            SafeAreaBridge.getStatusBarHeight() + "px",
          );
        }
      });
    </script>
    <link rel="icon" type="image/x-icon" href="static/favicon.png" />
    <link
      rel="preload"
      href="fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/overlay.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/animations.js"></script>
    <title>Weight Knapsnack</title>
  </head>

            <h3>Calculator</h3>
