<!doctype html>
<html lang="en">
  <head>
    <!-- Prevent theme flash: apply stored theme before any CSS loads -->
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("knapsnack_settings") || "{}",
          );
          var theme = s.theme || "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (s.oledMode)
            document.documentElement.setAttribute("data-oled", "true");
          if (window.SafeAreaBridge)
            SafeAreaBridge.setStatusBarStyle(theme === "light");
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Weight Knapsnack Settings - customize theme, units, and manage your data."
    />
    <meta property="og:title" content="Settings - Weight Knapsnack" />
    <meta
      property="og:description"
      content="Customize your Weight Knapsnack experience with theme and data settings."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ankitsm08.github.io/weight-knapsnack/settings.html"
    />
    <link
      rel="canonical"
      href="https://ankitsm08.github.io/weight-knapsnack/settings.html"
    />
    <link rel="icon" type="image/x-icon" href="static/favicon.png" />
    <link rel="stylesheet" href="css/overlay.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/animations.js"></script>
    <title>Settings - Weight Knapsnack</title>
  </head>

  <body>
    <nav>
      <a href="https://ankitsm08.github.io">
        <div class="logo"><i data-lucide="zap"></i> Ankit Sharma</div>
      </a>
      <button
        class="menu-toggle"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
      <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./knapsnack.html">Knapsnack</a>
        <a href="./profiles.html">Profiles</a>
        <a href="./settings.html" class="active">Settings</a>
        <a href="./about.html">About</a>
      </div>
    </nav>

    <main>
      <section class="center">
        <h1>Settings</h1>

        <div class="card">
          <h2 class="h2-icon"><i data-lucide="palette"></i> Theme</h2>
          <div class="theme-toggle">
            <button id="oled-mode-btn" class="oled-toggle" aria-pressed="false">
              <i data-lucide="droplet"></i> OLED
            </button>
            <button
              class="theme-btn"
              data-theme-value="dark"
              aria-label="Dark mode"
            >
              <i data-lucide="moon"></i>
            </button>
            <button
              class="theme-btn"
              data-theme-value="light"
              aria-label="Light mode"
            >
              <i data-lucide="sun"></i>
            </button>
          </div>
        </div>

        <div class="card">
          <h2 class="h2-icon"><i data-lucide="ruler"></i> Units</h2>
          <div class="units-grid">
            <div class="units-row">
              <span>Target Weight</span>
              <button
                class="unit-toggle"
                data-field="targetWeight"
                aria-label="Toggle target weight unit"
              >
                kg
              </button>
            </div>
            <div class="units-row">
              <span>Bag Weight</span>
              <button
                class="unit-toggle"
                data-field="bagWeight"
                aria-label="Toggle bag weight unit"
              >
                g
              </button>
            </div>
            <div class="units-row">
              <span>Bottle Weight</span>
              <button
                class="unit-toggle"
                data-field="bottleWeight"
                aria-label="Toggle bottle weight unit"
              >
                g
              </button>
            </div>
          </div>
          <p class="text-muted">Per-field unit preferences</p>
        </div>

        <div class="card">
          <h2 class="h2-icon">
            <i data-lucide="database"></i> Data Management
          </h2>
          <p class="text-muted">Export, import, and reset all your data.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> Ankit Sharma</p>
    </footer>

    <script src="js/storage.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/style.js" defer></script>
    <script
      src="js/vendor/lucide.min.js"
      defer
      onload="(self.requestIdleCallback || setTimeout)(lucide.createIcons)"
    ></script>
  </body>
</html>
