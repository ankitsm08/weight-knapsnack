<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("knapsnack_settings") || "{}",
          );
          var theme = s.theme || "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (s.oledMode)
            document.documentElement.setAttribute("data-oled", "true");
          if (window.SafeAreaBridge)
            SafeAreaBridge.setStatusBarStyle(theme === "light");
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Weight Knapsnack Profiles - create and manage bottle inventories."
    />
    <meta property="og:title" content="Profiles - Weight Knapsnack" />
    <meta
      property="og:description"
      content="Manage your bottle profiles for Weight Knapsnack."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ankitsm08.github.io/weight-knapsnack/profiles.html"
    />
    <link
      rel="canonical"
      href="https://ankitsm08.github.io/weight-knapsnack/profiles.html"
    />
    <link rel="icon" type="image/x-icon" href="static/favicon.png" />
    <link rel="stylesheet" href="css/overlay.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/animations.js"></script>
    <title>Profiles - Weight Knapsnack</title>
  </head>

  <body>
    <nav>
      <a href="https://ankitsm08.github.io">
        <div class="logo"><i data-lucide="zap"></i> Ankit Sharma</div>
      </a>
      <button
        class="menu-toggle"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
      <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./knapsnack.html">Knapsnack</a>
        <a href="./profiles.html" class="active">Profiles</a>
        <a href="./settings.html">Settings</a>
        <a href="./about.html">About</a>
      </div>
    </nav>

    <main>
      <section class="center profile-page">
        <h1>Manage Profiles</h1>

        <div class="profile-layout">
          <aside class="profile-sidebar">
            <div class="select-wrapper">
              <select id="profile-mobile-select" class="profile-mobile-select" aria-label="Select profile"></select>
              <i data-lucide="chevron-down" class="select-arrow"></i>
            </div>
            <ul id="profile-list" class="profile-list" role="tablist" aria-label="Profiles"></ul>
            <button type="button" id="new-profile-btn" class="btn btn-small">
              <i data-lucide="plus"></i> New Profile
            </button>
          </aside>

          <div id="profile-content" class="profile-content">
            <p class="text-muted">Select or create a profile to get started.</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> Ankit Sharma</p>
    </footer>

    <script src="js/storage.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/profiles.js" defer></script>
    <script src="js/style.js" defer></script>
    <script
      src="js/vendor/lucide.min.js"
      defer
      onload="(self.requestIdleCallback || setTimeout)(lucide.createIcons)"
    ></script>
